[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rotation-hrr"
version = "1.0.0"
description = "Rotation-HRR: one vector per partially ordered process variant, and its evaluation"
requires-python = ">=3.10"
license = {text = "GPL-3.0"}
dependencies = ["numpy", "scipy"]

[tool.setuptools.packages.find]
include = ["rotation_hrr*", "evaluation*"]
