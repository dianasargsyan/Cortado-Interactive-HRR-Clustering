<div class="modal-header bg-dark">
  <h5 class="modal-title text-light">Constraint Overview</h5>
  <button type="button" class="btn-close btn-close-white" (click)="activeModal.dismiss()"></button>
</div>

<div class="modal-body bg-dark">
  <div class="d-flex gap-4">

    <!-- Left: Must-link groups -->
    <div class="overview-section">
      <h6 class="text-success mb-3">
        <i class="bi bi-link-45deg"></i> Must-link Groups
      </h6>
      <div *ngIf="mustLinkGroups.length === 0" class="text-secondary small">
        No must-link constraints
      </div>
      <div class="d-flex flex-column gap-3">
        <div
          *ngFor="let group of mustLinkGroups"
          class="constraint-group must-group"
          [class.small-group]="group.members.length === 2"
        >
          <span *ngFor="let member of group.members" class="member-badge">
            #{{ member + 1 }}
          </span>
        </div>
      </div>
    </div>

    <div class="divider"></div>

    <!-- Right: Cannot-link pairs -->
    <div class="overview-section">
      <h6 class="text-danger mb-3">
        <i class="bi bi-scissors"></i> Cannot-link Pairs
      </h6>
      <div *ngIf="cannotLinkPairs.length === 0" class="text-secondary small">
        No cannot-link constraints
      </div>
      <div class="d-flex flex-column gap-3">
        <div *ngFor="let pair of cannotLinkPairs" class="constraint-group cannot-group">
          <span class="member-badge">#{{ pair[0] + 1 }}</span>
          <span class="member-badge">#{{ pair[1] + 1 }}</span>
        </div>
      </div>
    </div>

  </div>
</div>
